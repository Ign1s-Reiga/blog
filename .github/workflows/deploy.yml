name: Deploy to Cloudflare Workers

on:
  # Deploy only what arrives via a merged pull request — a direct push to main
  # no longer ships. pull_request_target (not pull_request) because it runs in the
  # base branch's context, so github.ref is refs/heads/main; a pull_request run is
  # refs/pull/<n>/merge, which the production environment's branch policy refuses.
  pull_request_target:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    # A pull request closed without merging must not deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit the merge produced on main (the squash commit for squash
          # merges); manual runs fall back to the dispatched ref.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # @ign1s-reiga/marked-presets is published to GitHub Packages, which
      # rejects unauthenticated reads. The package lives under this repo's
      # owner, so the job's GITHUB_TOKEN is enough — written at runtime so no
      # token or .npmrc is committed.
      - name: Authenticate to GitHub Packages
        run: |
          {
            echo "@ign1s-reiga:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
          } > .npmrc

      # deno.json maps "./src/server" into the module graph (worker-configuration.d.ts
      # refers to it), and src/server.ts imports _fresh/server.js — a `vite build`
      # artifact that a fresh checkout does not have, so `deno install` cannot resolve
      # it. The build overwrites this placeholder before the worker bundle is emitted;
      # it throws so a build that somehow skipped that step fails loudly.
      - name: Placeholder for the Fresh build artifact
        run: |
          mkdir -p _fresh
          echo "throw new Error('placeholder: _fresh/server.js was not replaced by the build');" > _fresh/server.js

      - name: Install dependencies
        run: deno install --frozen

      - name: Apply D1 migrations
        run: deno task db:migrate --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build
        run: deno task build

      - name: Deploy
        run: deno task deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
