name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # @ign1s-reiga/marked-presets is published to GitHub Packages, which
      # rejects unauthenticated reads. The package lives under this repo's
      # owner, so the job's GITHUB_TOKEN is enough — written at runtime so no
      # token or .npmrc is committed.
      - name: Authenticate to GitHub Packages
        run: |
          {
            echo "@ign1s-reiga:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
          } > .npmrc

      # deno.json maps "./src/server" into the module graph (worker-configuration.d.ts
      # refers to it), and src/server.ts imports _fresh/server.js — a `vite build`
      # artifact that a fresh checkout does not have, so `deno install` cannot resolve
      # it. The build overwrites this placeholder before the worker bundle is emitted;
      # it throws so a build that somehow skipped that step fails loudly.
      - name: Placeholder for the Fresh build artifact
        run: |
          mkdir -p _fresh
          echo "throw new Error('placeholder: _fresh/server.js was not replaced by the build');" > _fresh/server.js

      - name: Install dependencies
        run: deno install --frozen

      - name: Format
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Build
        run: deno task build
